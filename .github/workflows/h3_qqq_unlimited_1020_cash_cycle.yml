name: H3 QQQ Unlimited EMA10-20 Cash-Recovery Rotation
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_qqq_ema10_20_unlimited_cycle_in_cash.py
      - .github/workflows/h3_qqq_unlimited_1020_cash_cycle.yml
  workflow_dispatch:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_qqq_ema10_20_unlimited_cycle_in_cash.py --outdir research/results/h3_qqq_ema10_20_unlimited_cash_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-qqq-ema10-20-unlimited-cash-cycle
          path: research/results/h3_qqq_ema10_20_unlimited_cash_2026_11_11/
          if-no-files-found: warn
