name: H3 Midcycle EMA Overlay and Reentry Research
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_midcycle_fast_ema_overlay_reentry.py
      - .github/workflows/h3_midcycle_fast_reentry.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_midcycle_fast_ema_overlay_reentry.py --end 2026-11-11 --outdir research/results/h3_midcycle_fast_ema_overlay_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-midcycle-ema-protection-full-account
          path: research/results/h3_midcycle_fast_ema_overlay_2026_11_11/
          if-no-files-found: warn
