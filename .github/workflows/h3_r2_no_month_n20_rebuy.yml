name: H3 R2 Slow 20-60 No Month and N20 FAST Rebuy
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_r2_unrestricted_month_n20_fast_rebuy_engine.py
      - research/experiments/h3_r2_no_month_slow_cross_n20_fast_rebuy_backtest.py
      - .github/workflows/h3_r2_no_month_n20_rebuy.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_r2_no_month_slow_cross_n20_fast_rebuy_backtest.py --outdir research/results/h3_r2_no_month_n20_rebuy_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-r2-no-month-n20-fast-rebuy
          path: research/results/h3_r2_no_month_n20_rebuy_2026_11_11/
          if-no-files-found: warn
