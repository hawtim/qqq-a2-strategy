name: H3 QQQ A B Entry Age and Repeat Cycle Ablation
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_qqq_profit_guard_age_cycle_ablation.py
      - .github/workflows/h3_qqq_profit_guard_age_cycle.yml
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_qqq_profit_guard_age_cycle_ablation.py --outdir research/results/h3_qqq_A_B_age_cycle_ablation_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-qqq-A-B-age-cycle-ablation
          path: research/results/h3_qqq_A_B_age_cycle_ablation_2026_11_11/
          if-no-files-found: warn
