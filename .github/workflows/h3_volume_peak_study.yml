name: H3 QQQ and GOOGL volume peak study
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_volume_peak_exhaustion.py
      - .github/workflows/h3_volume_peak_study.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_volume_peak_exhaustion.py --end 2026-11-11 --outdir research/results/h3_volume_peak_study_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-volume-peak-study
          path: research/results/h3_volume_peak_study_2026_11_11/
          if-no-files-found: warn
