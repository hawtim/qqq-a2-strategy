name: H3 Frozen A-B Volatility Regime And Guard Event Attribution
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_ab_qqq_volatility_regime_event_attribution.py
      - .github/workflows/h3_ab_volatility_regime_attribution.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_ab_qqq_volatility_regime_event_attribution.py --outdir research/results/h3_ab_qqq_volatility_regime_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-ab-qqq-volatility-regime-attribution
          path: research/results/h3_ab_qqq_volatility_regime_2026_11_11/
          if-no-files-found: warn
