name: H3 Profit Guard A B Full Comparative Report
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_profit_guard_ab_full_report.py
      - .github/workflows/h3_profit_guard_ab_report.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_profit_guard_ab_full_report.py --end 2026-11-11 --outdir research/results/h3_profit_guard_ab_full_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-profit-guard-a-b-complete-four-way-report
          path: research/results/h3_profit_guard_ab_full_2026_11_11/
          if-no-files-found: warn
