name: H3 QQQ Post-2010 Cash Entry Opportunity Audit
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_qqq_post2010_flat_reentry_opportunity_audit.py
      - .github/workflows/h3_qqq_post2010_flat_audit.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_qqq_post2010_flat_reentry_opportunity_audit.py --outdir research/results/h3_qqq_post2010_flat_reentry_audit
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-qqq-post2010-flat-reentry-audit
          path: research/results/h3_qqq_post2010_flat_reentry_audit/
          if-no-files-found: warn
