name: H3 Entry Monthly Veto / EMA200 Ladder Audit
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_month_gate_entry_relax_engine.py
      - research/experiments/h3_entry_month_gate_ema200_ablation.py
      - .github/workflows/h3_entry_month_ema200_ladder.yml
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_entry_month_gate_ema200_ablation.py --outdir research/results/h3_monthly_ema200_entry_ladder_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-monthly-ema200-entry-ladder
          path: research/results/h3_monthly_ema200_entry_ladder_2026_11_11/
          if-no-files-found: warn
