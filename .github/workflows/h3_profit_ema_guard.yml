name: H3 EMA profit guard shadow account study
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_profit_n10_ema_guard_shadow_overlay.py
      - .github/workflows/h3_profit_ema_guard.yml
  workflow_dispatch:
jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_profit_n10_ema_guard_shadow_overlay.py --end 2026-11-11 --outdir research/results/h3_profit_n10_ema_guard_run
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-profit-n10-ema-guard
          path: research/results/h3_profit_n10_ema_guard_run/
          if-no-files-found: warn
