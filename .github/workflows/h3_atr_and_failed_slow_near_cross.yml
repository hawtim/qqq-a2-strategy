name: H3 ATR B-Sensitivity and Failed-Slow-Cross FAST Entry Study
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_b_atr14_20_30_x1_1p5_2_sensitivity.py
      - research/experiments/h3_failed_slow_near_cross_followed_fast_gold_event_study.py
      - .github/workflows/h3_atr_and_failed_slow_near_cross.yml
  workflow_dispatch:
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_b_atr14_20_30_x1_1p5_2_sensitivity.py --outdir research/results/h3_b_atr_parameter_sensitivity_2026_11_11
      - run: python research/experiments/h3_failed_slow_near_cross_followed_fast_gold_event_study.py --outdir research/results/h3_failed_slow_near_cross_fast_gold_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-b-atr-parameter-sensitivity
          path: research/results/h3_b_atr_parameter_sensitivity_2026_11_11/
          if-no-files-found: warn
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-slow-ema-near-miss-fast-gold
          path: research/results/h3_failed_slow_near_cross_fast_gold_2026_11_11/
          if-no-files-found: warn
