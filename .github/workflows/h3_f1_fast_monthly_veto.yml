name: H3 F1 EMA10-20 Conditional FAST Recovery Full Account
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/experiments/h3_f1_fast_recovery_veto_engine.py
      - research/experiments/h3_f1_fast_monthly_veto_recovery_backtest.py
      - .github/workflows/h3_f1_fast_monthly_veto.yml
  workflow_dispatch:
jobs:
  study:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_f1_fast_monthly_veto_recovery_backtest.py --outdir research/results/h3_f1_fast_monthly_veto_2026_11_11
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-f1-fast-month-veto-account
          path: research/results/h3_f1_fast_monthly_veto_2026_11_11/
          if-no-files-found: warn
