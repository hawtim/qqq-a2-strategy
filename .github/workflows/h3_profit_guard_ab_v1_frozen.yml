name: H3 Profit Guard A/B v1 Candidate Freeze Audit
on:
  push:
    branches:
      - research/v3-1-cross-asset-deferred-fast
    paths:
      - research/config/h3_profit_guard_ab_v1.json
      - research/experiments/h3_profit_guard_ab_v1_frozen.py
      - .github/workflows/h3_profit_guard_ab_v1_frozen.yml
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install -e '.[dev]'
      - run: python research/experiments/h3_profit_guard_ab_v1_frozen.py --outdir research/results/h3_profit_guard_ab_v1_candidate_frozen
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: h3-profit-guard-ab-v1-frozen-audit
          path: research/results/h3_profit_guard_ab_v1_candidate_frozen/
          if-no-files-found: warn
